:root{
  --bg:#0a0e17; --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.07);
  --border:#1d2a44; --border2:#31446b;
  --text:#e8eaf0; --muted:#95a4be; --faint:#647694;
  --acc:#22d3ee; --good:#34d399; --bad:#f87171;
  --fh:'Estedad',Tahoma,sans-serif; --fb:'Shabnam',Tahoma,sans-serif;
}
html[data-mode="light"]{
  --bg:#f4f5fa; --panel:#ffffff; --panel2:#eef1f8;
  --border:#e3e7f1; --border2:#c9d2e5;
  --text:#1b2233; --muted:#5c687f; --faint:#8b95ac;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:17px;line-height:1.9;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;
  background-image:radial-gradient(900px 500px at 80% -10%, color-mix(in srgb,var(--acc) 9%,transparent), transparent 60%),
                   radial-gradient(700px 400px at 10% 110%, color-mix(in srgb,var(--acc) 6%,transparent), transparent 60%)}
.card{width:min(430px,100%);background:var(--panel);border:1.5px solid var(--border2);border-radius:24px;
  padding:34px 34px 28px;backdrop-filter:blur(6px)}
.head{display:flex;justify-content:center;margin-bottom:10px}
.mark{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
  font-family:var(--fh);font-weight:800;font-size:26px;color:#062028;background:var(--acc)}
.head h1{font-family:var(--fh);font-size:24px;margin:0;flex:1}
.head h1 span{color:var(--acc)}
.sub{color:var(--muted);font-size:15px;margin:0 0 22px}
.modebtn{position:fixed;top:18px;left:18px;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:17px;cursor:pointer}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{background:none;border:none;color:var(--muted);font:inherit;font-family:var(--fh);font-size:15.5px;
  padding:8px;border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#062028;font-weight:800}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.frow input{width:100%;background:var(--panel);border:1.5px solid var(--border);border-radius:13px;color:var(--text);
  font:inherit;font-size:16px;padding:10px 14px;outline:none;transition:.15s}
.frow input:focus{border-color:var(--acc)}
.frow input.ltr{direction:ltr;text-align:left}
.go{width:100%;background:var(--acc);color:#062028;border:none;border-radius:14px;padding:12px;
  font-family:var(--fh);font-size:16.5px;font-weight:800;cursor:pointer;margin-top:6px}
.go:hover{filter:brightness(1.08)}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13.5px;margin:16px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);
  border:1.5px solid var(--border2);border-radius:14px;color:var(--text);font:inherit;font-family:var(--fh);
  font-size:15.5px;font-weight:700;padding:11px;cursor:pointer;text-decoration:none}
.gbtn:hover{border-color:var(--acc)}
.gbtn svg{width:19px;height:19px;flex:none}
.err{display:none;background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);
  color:var(--bad);border-radius:12px;padding:8px 14px;font-size:14.5px;margin-bottom:13px}
.err.show{display:block}
.hint{color:var(--faint);font-size:13px;text-align:center;margin-top:18px;border-top:1px dashed var(--border);padding-top:14px}
.hint b{color:var(--muted);font-weight:400}
#toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:var(--acc);color:#062028;
  font-family:var(--fh);font-weight:700;font-size:15px;border-radius:13px;padding:10px 22px;opacity:0;
  pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1}
</style>
</head>
<body>
<button class="modebtn" id="modeBtn">🌙</button>

<div class="card">
  <div class="head">
    <div class="mark">هـ</div>
  </div>
  <p class="sub">پول، کار، حال و هوات — همه در یک‌جا. خوش برگشتی 🌿</p>

  <div class="tabs">
    <button class="on" id="tLogin">ورود</button>
    <button id="tSignup">ثبت‌نام</button>
  </div>

  <div class="err" id="err"></div>

  <form id="form" autocomplete="on">
    <div class="frow" id="nameRow" style="display:none">
      <label>اسم قشنگت</label>
      <input id="fName" placeholder="حمیدرضا">
    </div>
    <div class="frow">
      <label>ایمیل</label>
      <input id="fEmail" class="ltr" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="frow">
      <label>رمز عبور</label>
      <input id="fPass" class="ltr" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="go" id="goBtn" type="submit">ورود</button>
  </form>

  <div class="or">یا</div>

  <a class="gbtn" href="/api/auth/google" id="gBtn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
    ورود با گوگل
  </a>

  <div class="hint">
    🔌 اتصال واقعی: <b>POST /api/auth/login</b> و <b>/signup</b> سرور خودت (کوکی ۳۰ روزه) · گوگل از <b>/api/auth/google</b> · در این پیش‌نمایشِ آفلاین، ورود شبیه‌سازی می‌شود
  </div>
</div>

<div id="toast"></div>

<script>
var faD='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return faD[d]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
var MODE='login';
var err=document.getElementById('err');
function showErr(m){err.textContent=m;err.classList.add('show')}
function hideErr(){err.classList.remove('show')}
document.getElementById('tLogin').addEventListener('click',function(){setMode('login')});
document.getElementById('tSignup').addEventListener('click',function(){setMode('signup')});
function setMode(m){
  MODE=m;hideErr();
  document.getElementById('tLogin').classList.toggle('on',m==='login');
  document.getElementById('tSignup').classList.toggle('on',m==='signup');
  document.getElementById('nameRow').style.display=m==='signup'?'block':'none';
  document.getElementById('goBtn').textContent=m==='signup'?'ساخت حساب':'ورود';
}
document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  var name=document.getElementById('fName').value.trim();
  var email=document.getElementById('fEmail').value.trim();
  var pass=document.getElementById('fPass').value;
  hideErr();
  if(MODE==='signup'&&!name)return showErr('اسمت را بنویس');
  if(!email||email.indexOf('@')<1)return showErr('ایمیل معتبر لازم است');
  if(pass.length<6)return showErr('رمز حداقل ۶ حرف');
  var path=MODE==='signup'?'/api/auth/signup':'/api/auth/login';
  var body=JSON.stringify(MODE==='signup'?{name:name,email:email,password:pass}:{email:email,password:pass});
  fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:body})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(res){
      if(!res.ok)return showErr(res.j.error||'ورود ناموفق بود');
      toast('خوش آمدی '+res.j.user.name+' 🌿');
      setTimeout(function(){location.href='/'},700);
    })
    .catch(function(){
      /* آفلاین/پیش‌نمایش */
      toast((MODE==='signup'?'حساب ساخته شد (نمایشی): ':'ورود نمایشی: ')+email.split('@')[0]+' 🌿');
      setTimeout(function(){location.href='cards-v2.html'},900);
    });
});
var mb=document.getElementById('modeBtn');
mb.addEventListener('click',function(){var r=document.documentElement,l=r.dataset.mode==='light';
  r.dataset.mode=l?'dark':'light';mb.textContent=l?'🌙':'☀️';});
</script>
</body>
</html>
