<!doctype html><html lang="fa" dir="rtl" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برنامه‌ریز · LifeOS</title><link rel="stylesheet" href="/shared-theme.css"><link rel="stylesheet" href="/shared-shell.css"><script src="/shared-ui.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);background-image:radial-gradient(800px 440px at 90% -10%,color-mix(in srgb,var(--acc) 13%,transparent),transparent 65%)}.wrap{max-width:1120px;margin:auto;padding:22px 20px 90px}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px;padding:25px;border:1px solid var(--border2);border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 13%,var(--panel)),var(--panel) 55%,color-mix(in srgb,#a78bfa 10%,var(--panel)))}h1{font:800 28px var(--fh);margin:0 0 5px}.hero p{color:var(--muted);margin:0}.stats{display:flex;gap:8px}.stat{min-width:84px;text-align:center;border:1px solid var(--border);border-radius:13px;padding:8px;background:var(--panel2)}.stat b{display:block;color:var(--acc);font:800 20px var(--fh)}.stat small{color:var(--muted)}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow-card)}.card h2{font:800 17px var(--fh);margin:0 0 14px}.form{display:grid;gap:9px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--border);border-radius:11px;background:var(--panel2);color:var(--text);font:inherit;padding:10px;outline:none}.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--acc)}.form textarea{min-height:84px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px}.check input{width:auto}.submit{border:0;border-radius:11px;padding:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#05232a;font:800 15px var(--fh);cursor:pointer}.submit:disabled{opacity:.6}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.filter{border:1px solid var(--border);border-radius:999px;padding:6px 11px;background:var(--panel2);color:var(--muted);font:inherit;font-size:12px;cursor:pointer}.filter.on{border-color:var(--acc);color:var(--acc)}.day{margin:0 0 17px}.day h3{font:800 14px var(--fh);margin:0 0 8px;color:var(--muted)}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--panel2);margin-bottom:7px}.item.done{opacity:.55}.donebtn{width:21px;height:21px;border-radius:50%;border:2px solid var(--acc);background:transparent;cursor:pointer;margin-top:2px}.done .donebtn{background:var(--acc)}.item b{font-family:var(--fh);font-size:15px}.item small{display:block;color:var(--muted);margin-top:3px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{padding:2px 7px;border-radius:999px;font-size:11px;background:color-mix(in srgb,var(--acc) 12%,var(--panel));color:var(--acc)}.prio-high{color:#fb7185}.prio-low{color:#34d399}.delete{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:16px}.empty{padding:26px;text-align:center;color:var(--faint);border:1px dashed var(--border);border-radius:13px}.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:var(--acc);color:#04242b;border-radius:12px;padding:9px 17px;opacity:0;transition:.2s;font-weight:700}.toast.show{opacity:1}@media(max-width:760px){.wrap{padding:14px}.hero{display:block}.stats{margin-top:15px}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style></head><body><nav class="nav"><a class="brand" href="/">هـ</a><div class="navlinks"><a href="/">🏠 امروز</a><a class="on" href="/design/planner-page.html">✅ برنامه‌ریز</a><a href="/design/calendar-page.html">📅 تقویم</a><a href="/design/notes-page.html">📝 یادداشت‌ها</a><a href="/design/finance-page.html">💰 مالی</a></div><div class="navtools"><button class="iconbtn" id="modeBtn" type="button">🌙</button><span id="navAuth"></span></div></nav><script>(function(){var n=document.querySelector('.nav'),s=document.createElement('div');s.style.height=n.offsetHeight+'px';n.after(s);addEventListener('resize',function(){s.style.height=n.offsetHeight+'px'})})()</script><main class="wrap"><section class="hero"><div><h1>برنامه‌ریز کارها و یادآوری‌ها</h1><p>هر کار یک زمان‌بندی روشن دارد؛ در صورت نیاز، یادآوریِ متصلش هم با همان فرم ساخته می‌شود.</p></div><div class="stats"><div class="stat"><b id="openN">۰</b><small>باز</small></div><div class="stat"><b id="todayN">۰</b><small>امروز</small></div><div class="stat"><b id="remN">۰</b><small>یادآوری</small></div></div></section><section class="grid"><aside class="card"><h2>کار تازه</h2><form id="form" class="form"><input id="title" required maxlength="120" placeholder="عنوان کار *"><textarea id="notes" maxlength="2000" placeholder="توضیحات یا نتیجهٔ مورد انتظار"></textarea><div class="fields"><input id="date" type="date" required><input id="time" type="time"></div><div class="fields"><select id="priority"><option value="medium">اولویت متوسط</option><option value="high">اولویت بالا</option><option value="low">اولویت پایین</option></select><select id="repeat"><option value="">بدون تکرار</option><option value="daily">روزانه</option><option value="weekly">هفتگی</option><option value="monthly">ماهانه</option></select></div><input id="tags" maxlength="160" placeholder="تگ‌ها: کار، شخصی، پروژه"><label class="check"><input id="reminder" type="checkbox"> برای این کار یادآوری بساز</label><div class="fields" id="remFields" hidden><input id="remDate" type="date"><input id="remTime" type="time"></div><button class="submit" id="save">ذخیرهٔ کار</button></form></aside><section class="card"><h2>زمان‌بندی من</h2><div class="filters"><button class="filter on" data-f="open">باز</button><button class="filter" data-f="today">امروز</button><button class="filter" data-f="all">همه</button><button class="filter" data-f="done">انجام‌شده</button></div><div id="list"><div class="empty">در حال دریافت…</div></div></section></section></main><div id="toast" class="toast"></div><script>
var TASKS=[],REMS=[],FILTER='open';var $=function(id){return document.getElementById(id)},today=new Date().toISOString().slice(0,10);$('date').value=today;$('remDate').value=today;function fa(n){return String(n).replace(/\d/g,function(x){return'۰۱۲۳۴۵۶۷۸۹'[x]})}function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function say(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2200)}function tags(s){return String(s||'').split(/[,،#]/).map(function(x){return x.trim()}).filter(Boolean).slice(0,8)}function remFor(t){return REMS.filter(function(r){return r.taskId===t.id})}function label(d){return d===today?'امروز':new Date(d+'T12:00:00').toLocaleDateString('fa-IR',{month:'short',day:'numeric'})}function render(){var shown=TASKS.slice();if(FILTER==='open')shown=shown.filter(function(x){return!x.done});if(FILTER==='done')shown=shown.filter(function(x){return x.done});if(FILTER==='today')shown=shown.filter(function(x){return x.date===today});shown.sort(function(a,b){return Number(a.done)-Number(b.done)||String(a.date).localeCompare(String(b.date))||String(a.startTime||'').localeCompare(String(b.startTime||''))});$('openN').textContent=fa(TASKS.filter(function(x){return!x.done}).length);$('todayN').textContent=fa(TASKS.filter(function(x){return x.date===today&&!x.done}).length);$('remN').textContent=fa(REMS.filter(function(x){return!x.done}).length);if(!shown.length){$('list').innerHTML='<div class="empty">چیزی در این نما نیست.</div>';return}var groups={};shown.forEach(function(t){(groups[t.date]||(groups[t.date]=[])).push(t)});$('list').innerHTML=Object.keys(groups).sort().map(function(d){return'<section class="day"><h3>'+label(d)+'</h3>'+groups[d].map(function(t){var rs=remFor(t),meta=(t.startTime?'🕒 '+t.startTime:'بدون ساعت')+(t.recurrence?' · 🔁 '+({daily:'روزانه',weekly:'هفتگی',monthly:'ماهانه'}[t.recurrence]):'');return'<article class="item '+(t.done?'done':'')+'" data-id="'+t.id+'"><button class="donebtn" title="انجام شد"></button><div><b>'+esc(t.title)+'</b><small class="prio-'+esc(t.priority)+'">'+meta+'</small>'+(t.notes?'<small>'+esc(t.notes)+'</small>':'')+'<div class="badges">'+(t.tags||[]).map(function(x){return'<span class="badge">#'+esc(x)+'</span>'}).join('')+(rs.length?'<span class="badge">🔔 '+(rs[0].time||'یادآوری')+'</span>':'')+'</div></div><button class="delete" title="حذف">×</button></article>'}).join('')+'</section>'}).join('')}
function load(){return Promise.all([fetch('/api/tasks',{credentials:'include'}),fetch('/api/reminders?from=0000-01-01&to=9999-12-31',{credentials:'include'})]).then(function(a){return Promise.all(a.map(function(r){if(r.status===401){location.href='/design/login-page.html';return{items:[]}}return r.json()}))}).then(function(x){TASKS=x[0].items||[];REMS=x[1].items||[];render()}).catch(function(){$('list').innerHTML='<div class="empty">خطا در دریافت داده</div>'})}$('reminder').onchange=function(){$('remFields').hidden=!this.checked};$('form').onsubmit=function(e){e.preventDefault();var b=$('save'),payload={title:$('title').value.trim(),notes:$('notes').value.trim(),date:$('date').value,startTime:$('time').value||null,priority:$('priority').value,recurrence:$('repeat').value||null,tags:tags($('tags').value)};if(!payload.title)return;b.disabled=true;fetch('/api/tasks',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(x){if(!x.ok)throw Error(x.d.error);TASKS.push(x.d);if(!$('reminder').checked)return null;return fetch('/api/reminders',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:x.d.title,date:$('remDate').value||payload.date,time:$('remTime').value||null,whenLabel:$('remDate').value||payload.date,recurrence:payload.recurrence,taskId:x.d.id})}).then(function(r){return r.json()})}).then(function(rem){if(rem&&rem.id)REMS.push(rem);$('form').reset();$('date').value=today;$('remDate').value=today;$('remFields').hidden=true;say('کار'+(rem?' و یادآوری مرتبطش':'')+' ذخیره شد ✓');render()}).catch(function(e){say(e.message||'ذخیره نشد')}).finally(function(){b.disabled=false})};$('list').onclick=function(e){var row=e.target.closest('.item');if(!row)return;var t=TASKS.find(function(x){return x.id===row.dataset.id});if(!t)return;if(e.target.closest('.delete')){if(!confirm('این کار حذف شود؟'))return;fetch('/api/tasks/'+encodeURIComponent(t.id),{method:'DELETE',credentials:'include'}).then(function(r){if(!r.ok)throw Error();TASKS=TASKS.filter(function(x){return x.id!==t.id});render();say('حذف شد')}).catch(function(){say('حذف نشد')});return}if(e.target.closest('.donebtn')){t.done=!t.done;fetch('/api/tasks/'+encodeURIComponent(t.id),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:t.done})}).then(function(r){if(!r.ok)throw Error();remFor(t).forEach(function(rem){rem.done=t.done;fetch('/api/reminders/'+encodeURIComponent(rem.id),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:t.done})})});render();say(t.done?'انجام شد ✓':'دوباره باز شد')}).catch(function(){t.done=!t.done;say('ذخیره نشد')})}};document.querySelector('.filters').onclick=function(e){var b=e.target.closest('[data-f]');if(!b)return;FILTER=b.dataset.f;document.querySelectorAll('.filter').forEach(function(x){x.classList.toggle('on',x===b)});render()};$('modeBtn').onclick=function(){var e=document.documentElement,l=e.dataset.mode==='light';e.dataset.mode=l?'dark':'light';this.textContent=l?'🌙':'☀️'};load();
</script></body></html>
