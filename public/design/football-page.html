<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فوتبال · هسته</title>

<link rel="stylesheet" href="/shared-theme.css">
<script src="/shared-ui.js"></script>
<link rel="stylesheet" href="/assets/css/core.css">
<link rel="preload" href="/assets/fonts/Estedad.woff2" as="font" type="font/woff2" crossorigin>
<style>

/* ===== نوار بالا ثابت (هم‌سان با بقیهٔ صفحات) ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px)}
.navlinks a.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:700}

/* ===== سربرگ ===== */
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px 80px}
.fb-head{padding:8px 2px 4px}
.fb-head h1{margin:0 0 4px;font-family:var(--fh);font-size:26px}
.fb-head p{margin:0;color:var(--faint);font-size:14px}

/* ===== تب‌های لیگ ===== */
.fb-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fb-tab{font-family:var(--fh);font-size:14px;font-weight:700;border:1.5px solid var(--border2);background:var(--panel);color:var(--muted);border-radius:14px;padding:9px 16px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.fb-tab:hover{border-color:var(--acc);color:var(--text)}
.fb-tab.on{background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:var(--acc);color:var(--acc)}

/* ===== دو ستون: جدول چپ، بازی‌ها راست ===== */
.fb-layout{display:grid;grid-template-columns:minmax(390px,.88fr) minmax(480px,1.12fr);gap:14px;align-items:start;direction:ltr}
.fb-card{min-width:0;background:var(--panel);border:1.5px solid var(--border2);border-radius:20px;padding:16px 18px;margin:0;box-shadow:var(--shadow-card);direction:rtl}
.fb-table-card{grid-column:1}
.fb-matches-card{grid-column:2}
.fb-card h3{margin:0 0 12px;font-family:var(--fh);font-size:16px;display:flex;align-items:center;gap:8px}
.fb-note{font-size:12.5px;color:var(--faint);margin-top:10px}
.fb-loading,.fb-empty{padding:24px 4px;text-align:center;color:var(--faint);font-size:14px}

/* ===== جدول فشرده ===== */
.fb-tablewrap{overflow-x:auto}
table.fb-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:370px;table-layout:auto}
table.fb-table th{color:var(--faint);font-weight:600;font-size:11px;padding:4px 3px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.fb-table th.fb-tteam{text-align:right}
table.fb-table td{padding:5px 3px;text-align:center;border-bottom:1px dashed var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
table.fb-table tr:last-child td{border-bottom:none}
table.fb-table td.fb-trank{color:var(--faint);font-weight:700;width:22px}
table.fb-table td.fb-tteam{text-align:right;display:flex;align-items:center;gap:5px;border-bottom:1px dashed var(--border);min-width:112px}
table.fb-table td.fb-tteam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.fb-table td.fb-tteam img{width:17px;height:17px;object-fit:contain;border-radius:50%;flex:none}
table.fb-table td.fb-tpts{font-weight:800;color:var(--text);padding-inline:5px}
table.fb-table tr:nth-child(-n+4) td.fb-trank{color:var(--good)}

/* ===== لیست بازی‌ها (هم‌تراز با ویجت صفحهٔ امروز) ===== */
.fb-datehead{font-size:12.5px;color:var(--faint);margin:14px 2px 4px;font-weight:700}
.fb-datehead:first-child{margin-top:2px}
.grow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px dashed var(--border);font-size:14.5px}
.grow:last-child{border-bottom:none}
.grow.st-live{background:color-mix(in srgb,var(--bad) 7%,transparent);border-radius:10px;padding:9px 6px;margin:2px 0;border-bottom-color:transparent}
.grow.st-finished{opacity:.78}
.grow .gtag{flex:none}
.grow .gline{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.grow .gside{display:flex;align-items:center;gap:6px;min-width:0}
.grow .gside.away{justify-content:flex-end}
.grow .gn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:var(--text)}
.grow .glogo{width:22px;height:22px;flex:none;object-fit:contain;border-radius:50%}
.grow .gph{display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:700}
.grow .gcenter{flex:none;text-align:center;min-width:3.8em;font-family:var(--fh);font-weight:700;color:var(--muted);white-space:nowrap}
.grow .gcenter.score{color:var(--text);background:var(--panel2);border-radius:8px;padding:3px 9px}
.grow .gcenter.kick{color:var(--faint);font-weight:600}
.grow .gcenter.live{color:var(--bad);font-weight:800}
.grow .gtag .glive{color:var(--bad);font-size:12px;white-space:nowrap;font-weight:700}
.grow .gtag .gdone{color:var(--faint);font-size:12px;white-space:nowrap;font-weight:600}

@media(max-width:980px){
  .fb-layout{grid-template-columns:1fr;direction:rtl}
  .fb-table-card,.fb-matches-card{grid-column:auto}
  .fb-matches-card{order:1}
  .fb-table-card{order:2}
}
@media(max-width:640px){
  .wrap{padding:14px 12px 70px}
  .fb-tabs{gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .fb-tab{padding:8px 12px;font-size:13px;flex:none}
  .fb-card{padding:14px 12px}
  table.fb-table{min-width:350px;font-size:12px}
}
</style>
<link rel="stylesheet" href="/shared-shell.css">
</head>
<body>
<div class="wrap">
<nav class="nav"><a class="brand" href="/">هـ</a><div class="navlinks"><a href="/">🏠 امروز</a><a href="/design/calendar-page.html">📅 تقویم</a><a href="/design/finance-page.html">💰 مالی</a><a href="/design/market-page.html">📈 بازار</a><a href="/design/football-page.html" class="on">⚽ فوتبال</a><a href="/design/series-page.html">🎬 سریال‌ها</a><a href="/design/movies-page.html">🎞 فیلم‌ها</a><a href="/design/spotify-page.html">🎵 موسیقی</a><a href="/design/youtube-page.html">▶️ یوتیوب</a><a href="/design/documents-page.html">📄 مدارک</a><a href="/design/contacts-page.html">👥 مخاطبین</a><a href="/design/settings-page.html">⚙️ تنظیمات</a></div><div class="navtools"><button class="iconbtn" id="modeBtn" type="button">🌙</button><span id="navAuth"></span></div></nav>

<header class="fb-head">
  <h1>⚽ فوتبال</h1>
  <p>لیگ‌های بزرگ اروپا و ایران · جدول و بازی‌ها و نتایج</p>
</header>

<div class="fb-tabs" id="fbTabs"></div>

<div class="fb-layout">
  <section class="fb-card fb-table-card">
    <h3>🏆 جدول <span id="fbTableLeague" style="color:var(--faint);font-weight:500;font-size:13px"></span></h3>
    <div class="fb-tablewrap"><div id="fbTable" class="fb-loading">در حال دریافت…</div></div>
  </section>

  <section class="fb-card fb-matches-card">
    <h3>📅 بازی‌ها و نتایج <small style="color:var(--faint);font-size:11.5px;font-weight:500">جدید به قدیم</small></h3>
    <div id="fbMatches" class="fb-loading">در حال دریافت…</div>
    <div class="fb-note" id="fbNote"></div>
  </section>
</div>

</div>
<script>(function(){var n=document.querySelector('.nav');if(!n)return;var s=document.createElement('div');s.style.height=n.offsetHeight+'px';n.parentNode.insertBefore(s,n.nextSibling);window.addEventListener('resize',function(){s.style.height=n.offsetHeight+'px'})})();</script>
<script src="/assets/js/core.js" defer></script>
<script defer>
(function(){
  var LEAGUES=[
    {id:'irn.1',label:'ایران',flag:'🇮🇷'},
    {id:'eng.1',label:'انگلیس',flag:'🏴'},
    {id:'esp.1',label:'اسپانیا',flag:'🇪🇸'},
    {id:'ita.1',label:'ایتالیا',flag:'🇮🇹'},
    {id:'ger.1',label:'آلمان',flag:'🇩🇪'},
    {id:'fra.1',label:'فرانسه',flag:'🇫🇷'},
    {id:'por.1',label:'پرتغال',flag:'🇵🇹'},
    {id:'uefa.champions',label:'لیگ قهرمانان اروپا',flag:'🏆'}
  ];
  function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
  function cl(x){return String(x==null?'':x).replace(/[<>&]/g,'')}

  var params=new URLSearchParams(location.search);
  var activeId=params.get('league')||'irn.1';
  if(!LEAGUES.some(function(l){return l.id===activeId}))activeId='irn.1';

  function renderTabs(){
    var box=document.getElementById('fbTabs');
    box.innerHTML=LEAGUES.map(function(l){
      return '<button type="button" class="fb-tab'+(l.id===activeId?' on':'')+'" data-l="'+l.id+'">'+l.flag+' '+l.label+'</button>';
    }).join('');
  }
  document.getElementById('fbTabs').addEventListener('click',function(e){
    var b=e.target.closest('.fb-tab');if(!b)return;
    var id=b.getAttribute('data-l');if(id===activeId)return;
    activeId=id;
    try{history.replaceState(null,'','?league='+id)}catch(err){}
    load();
  });

  function logo(url,name){
    if(url)return '<img class="glogo" src="'+cl(url)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
    var ch=(name||'?').trim().charAt(0);
    return '<span class="glogo gph">'+cl(ch)+'</span>';
  }

  function renderStandings(items,league){
    document.getElementById('fbTableLeague').textContent=league?('· '+league.flag+' '+league.label):'';
    var el=document.getElementById('fbTable');
    if(!items||!items.length){el.innerHTML='<div class="fb-empty">جدولی برای این لیگ در دسترس نیست</div>';return}
    var rows=items.map(function(t){
      return '<tr><td class="fb-trank">'+fa(t.rank||'')+'</td>'
        +'<td class="fb-tteam">'+logo(t.logo,t.team)+'<span>'+cl(t.team)+'</span></td>'
        +'<td>'+fa(t.played||0)+'</td>'
        +'<td>'+fa(t.win||0)+'</td>'
        +'<td>'+fa(t.draw||0)+'</td>'
        +'<td>'+fa(t.loss||0)+'</td>'
        +'<td>'+(t.gd>0?'+':'')+fa(t.gd||0)+'</td>'
        +'<td class="fb-tpts">'+fa(t.pts||0)+'</td></tr>';
    }).join('');
    el.innerHTML='<table class="fb-table"><thead><tr>'
      +'<th></th><th class="fb-tteam">تیم</th><th>ب</th><th>ب‌ب</th><th>م</th><th>ش</th><th>گل</th><th>امتیاز</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table>';
  }

  function matchRow(m){
    var st=m.status||'upcoming';
    var hs=(m.homeScore!=null&&m.homeScore!=='')?Number(m.homeScore):null;
    var as=(m.awayScore!=null&&m.awayScore!=='')?Number(m.awayScore):null;
    if((hs==null||as==null)&&m.score&&/\d/.test(String(m.score))){
      var parts=String(m.score).replace(/–|—/g,'-').split(/\s*-\s*/);
      if(parts.length>=2){var n0=Number(String(parts[0]).trim()),n1=Number(String(parts[1]).trim());if(!isNaN(n0)&&!isNaN(n1)){hs=n0;as=n1}}
    }
    var hasScore=hs!=null&&as!=null&&!isNaN(hs)&&!isNaN(as);
    if(st!=='live'&&st!=='finished')hasScore=false;
    var tm='';
    try{if(m.date)tm=new Date(m.date).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tehran'})}catch(e){}
    var center;
    if(st==='live'&&!hasScore)center='<span class="gcenter live">زنده</span>';
    else if(hasScore)center='<span class="gcenter score" dir="ltr"><b>'+hs+'</b><i>-</i><b>'+as+'</b></span>';
    else center='<span class="gcenter kick" dir="ltr" title="به‌وقت تهران">'+cl(tm||'—')+'</span>';
    var tag='';
    if(st==='live')tag='<span class="glive">● زنده</span>';
    else if(st==='finished')tag='<span class="gdone">پایان</span>';
    return '<div class="grow st-'+cl(st)+'" dir="ltr">'
      +(tag?'<div class="gtag">'+tag+'</div>':'')
      +'<div class="gline">'
        +'<span class="gside home">'+logo(m.homeLogo,m.home)+'<span class="gn">'+cl(m.home||'—')+'</span></span>'
        +center
        +'<span class="gside away"><span class="gn">'+cl(m.away||'—')+'</span>'+logo(m.awayLogo,m.away)+'</span>'
      +'</div></div>';
  }

  function renderMatches(items,leagueId){
    var el=document.getElementById('fbMatches'),note=document.getElementById('fbNote');
    if(!items||!items.length){el.innerHTML='<div class="fb-empty">بازی‌ای در بازهٔ نزدیک پیدا نشد</div>';note.textContent='';return}
    var tehranToday=(function(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}})();
    var byDate={},order=[];
    items.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))}).forEach(function(m){
      var d='';try{d=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(m.date))}catch(e){d=String(m.date||'').slice(0,10)}
      if(!byDate[d]){byDate[d]=[];order.push(d)}
      byDate[d].push(m);
    });
    order.sort(function(a,b){return b.localeCompare(a)});
    var h='';
    order.forEach(function(d){
      var label;
      if(d===tehranToday)label='امروز';
      else{try{label=new Intl.DateTimeFormat('fa-IR',{weekday:'long',day:'numeric',month:'long'}).format(new Date(d+'T12:00:00'))}catch(e){label=d}}
      h+='<div class="fb-datehead">'+label+'</div>'+byDate[d].map(matchRow).join('');
    });
    el.innerHTML=h;
    note.textContent=leagueId==='irn.1'?'برای لیگ ایران فقط بازی‌های امروز از منبع رایگان در دسترسه؛ جدول کامل‌تره.':'';
  }

  function load(){
    renderTabs();
    var league=LEAGUES.filter(function(l){return l.id===activeId})[0];
    document.getElementById('fbTable').innerHTML='<div class="fb-loading">در حال دریافت…</div>';
    document.getElementById('fbMatches').innerHTML='<div class="fb-loading">در حال دریافت…</div>';
    Promise.all([
      fetch('/api/football/remote/free/standings?league='+encodeURIComponent(activeId),{credentials:'include'}).then(function(r){return r.json()}).catch(function(){return{items:[]}}),
      fetch('/api/football/remote/free/matches?league='+encodeURIComponent(activeId),{credentials:'include'}).then(function(r){return r.json()}).catch(function(){return{items:[]}})
    ]).then(function(res){
      renderStandings(res[0].items||[],league);
      renderMatches(res[1].items||[],activeId);
    });
  }

  load();
})();
</script>
</body>
</html>
