<!DOCTYPE html>
<html lang="fa" dir="rtl" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>یادداشت‌ها · LifeOS</title>
<link rel="stylesheet" href="/shared-theme.css">
<link rel="stylesheet" href="/shared-shell.css">
<script src="/shared-ui.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16.5px;line-height:1.7;
  background-image:radial-gradient(1000px 560px at 85% -6%, color-mix(in srgb,var(--acc) 10%,transparent), transparent 62%),
    radial-gradient(900px 500px at -8% 100%, color-mix(in srgb,var(--acc) 5%,transparent), transparent 58%);
  background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:20px 22px 100px}
.card{background:var(--panel);border:1.5px solid var(--border2);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow-card)}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:12px 0 20px;padding:24px;border:1px solid color-mix(in srgb,var(--acc) 24%,var(--border));border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 13%,var(--panel)) 0%,var(--panel) 55%,color-mix(in srgb,#a78bfa 10%,var(--panel)) 100%);overflow:hidden;position:relative}
.hero:after{content:'✦';position:absolute;left:28px;top:-24px;font-size:110px;color:color-mix(in srgb,var(--acc) 12%,transparent);transform:rotate(-12deg)}
.page-title{font-family:var(--fh);font-size:30px;font-weight:800;margin:0 0 4px;position:relative;z-index:1}
.page-sub{color:var(--muted);font-size:14px;margin:0;max-width:660px;position:relative;z-index:1}
.note-stats{display:flex;gap:9px;position:relative;z-index:1}.stat{min-width:82px;padding:9px 12px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--panel) 83%,transparent);text-align:center}.stat b{display:block;font-family:var(--fh);font-size:20px;color:var(--acc);line-height:1.1}.stat span{font-size:11px;color:var(--muted)}
.addbox{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.addbox textarea{width:100%;min-height:64px;resize:vertical;background:var(--panel2);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font:inherit;font-family:var(--fb);padding:12px 14px;outline:none;transition:border-color .2s}
.addbox textarea:focus{border-color:var(--acc)}
.addrow{display:flex;justify-content:space-between;align-items:center}
.addrow small{color:var(--faint);font-size:12.5px}
.addrow button{background:linear-gradient(135deg,var(--acc) 0%,var(--acc2) 100%);color:#062028;border:none;border-radius:11px;padding:9px 22px;font:inherit;font-family:var(--fh);font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 4px 14px -4px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.addrow button:hover{filter:brightness(1.08)}
.note-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 14px;flex-wrap:wrap}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--border);border-radius:999px;background:var(--panel2);color:var(--muted);padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}.filter:hover,.filter.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,var(--panel2));color:var(--acc)}
.searchrow{margin:0;min-width:min(100%,260px);flex:1}
.searchrow input{width:100%;background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font:inherit;padding:10px 14px;outline:none;transition:border-color .2s}
.searchrow input:focus{border-color:var(--acc)}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.note-card{--tone:var(--acc);background:linear-gradient(150deg,color-mix(in srgb,var(--tone) 9%,var(--panel)) 0%,var(--panel) 45%);border:1px solid color-mix(in srgb,var(--tone) 28%,var(--border));border-radius:20px;padding:16px;min-height:206px;display:flex;flex-direction:column;gap:10px;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}
.note-card:before{content:'';position:absolute;right:0;top:0;width:70px;height:5px;border-radius:0 0 0 8px;background:var(--tone)}.tone-0{--tone:#22d3ee}.tone-1{--tone:#a78bfa}.tone-2{--tone:#fb7185}.tone-3{--tone:#fbbf24}.tone-4{--tone:#34d399}
.note-card:hover{transform:translateY(-3px);border-color:var(--tone);box-shadow:var(--shadow-card-hover)}
.note-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:2px}.note-kind{font-size:12px;color:var(--tone);font-weight:700}.note-time{color:var(--faint);font-size:12px;position:relative;z-index:1}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.9;flex:1;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.note-card.expanded .note-text{display:block;overflow:visible}
.note-text[contenteditable="true"]{outline:none;border:1px dashed var(--acc);border-radius:8px;padding:4px 6px}
.note-tags{display:flex;gap:5px;flex-wrap:wrap;min-height:20px}.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--tone) 13%,var(--panel2));color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 30%,transparent)}
.note-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;position:relative;z-index:1}
.note-actions button{border:1px solid var(--border);border-radius:9px;background:var(--panel2);color:var(--muted);font:inherit;font-size:12px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.note-actions button:hover{border-color:var(--acc);color:var(--acc)}
.note-actions button.danger:hover{border-color:var(--bad);color:var(--bad)}
.expand{align-self:flex-start;border:0;background:transparent;color:var(--acc);font:inherit;font-size:12px;padding:0;cursor:pointer}
.empty{grid-column:1/-1;color:var(--faint);font-size:14px;padding:30px 10px;text-align:center;border:1px dashed var(--border);border-radius:16px}
#toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:var(--acc);color:#062028;font-family:var(--fh);font-weight:700;font-size:15px;border-radius:13px;padding:10px 22px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1}
@media(max-width:620px){.wrap{padding:14px 14px 80px}.hero{grid-template-columns:1fr;padding:18px}.note-stats{justify-content:flex-start}.notes-grid{grid-template-columns:1fr}.note-toolbar{align-items:stretch}.searchrow{min-width:100%}}
</style>
</head>
<body>
<nav class="nav"><a class="brand" href="/">هـ</a><div class="navlinks"><a href="/">🏠 امروز</a><a href="/design/calendar-page.html">📅 تقویم</a><a href="/design/finance-page.html">💰 مالی</a><a href="/design/market-page.html">📈 بازار</a><a href="/design/football-page.html">⚽ فوتبال</a><a href="/design/series-page.html">🎬 سریال‌ها</a><a href="/design/movies-page.html">🎞 فیلم‌ها</a><a href="/design/spotify-page.html">🎵 موسیقی</a><a href="/design/youtube-page.html">▶️ یوتیوب</a><a href="/design/notes-page.html" class="on">📝 یادداشت‌ها</a><a href="/design/documents-page.html">📄 مدارک</a><a href="/design/contacts-page.html">👥 مخاطبین</a><a href="/design/settings-page.html">⚙️ تنظیمات</a></div><div class="navtools"><button class="iconbtn" id="modeBtn" type="button">🌙</button><span id="navAuth"></span></div></nav>
<script>(function(){var n=document.querySelector('.nav');if(!n)return;var s=document.createElement('div');s.style.height=n.offsetHeight+'px';n.parentNode.insertBefore(s,n.nextSibling);window.addEventListener('resize',function(){s.style.height=n.offsetHeight+'px'})})();</script>
<div class="wrap">
  <section class="hero">
    <div><div class="page-title">یادداشت‌های من ✦</div><p class="page-sub">ایده‌ها، لینک‌ها و هر چیزی که بعداً می‌خواهی مرتب کنی؛ با یک کلیک تبدیلش کن به کار یا یادآوری.</p></div>
    <div class="note-stats"><div class="stat"><b id="notesCount">۰</b><span>همهٔ یادداشت‌ها</span></div><div class="stat"><b id="todayCount">۰</b><span>ثبت امروز</span></div></div>
  </section>

  <div class="card addbox">
    <textarea id="noteIn" placeholder="یادداشت جدید..."></textarea>
    <div class="addrow"><small>Ctrl+Enter برای ثبت سریع</small><button type="button" id="noteAdd">➕ ثبت یادداشت</button></div>
  </div>

  <div class="note-toolbar"><div class="filters"><button class="filter on" data-filter="all">همه</button><button class="filter" data-filter="today">امروز</button><button class="filter" data-filter="links">لینک‌ها</button><button class="filter" data-filter="tagged">تگ‌دار</button></div><div class="searchrow"><input type="text" id="noteSearch" placeholder="جستجو در یادداشت‌ها..."></div></div>

  <div class="notes-grid" id="notesGrid"><div class="empty">در حال دریافت...</div></div>
</div>
<div id="toast"></div>
<script>
var NOTES=[],ACTIVE_FILTER='all';
function fa(n){var d='۰۱۲۳۴۵۶۷۸۹';return String(n).replace(/\d/g,function(c){return d[c]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function esc(s){return String(s||'').replace(/[<>&]/g,function(c){return({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]})}
function relTime(ts){
  var diff=Math.max(0,Date.now()-Number(ts||0));
  var m=Math.floor(diff/60000);
  if(m<1)return 'همین حالا';
  if(m<60)return fa(m)+' دقیقه پیش';
  var h=Math.floor(m/60);
  if(h<24)return fa(h)+' ساعت پیش';
  var d=Math.floor(h/24);
  if(d<30)return fa(d)+' روز پیش';
  return new Date(Number(ts)).toLocaleDateString('fa-IR');
}
function isToday(ts){var d=new Date(Number(ts||0)),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}
function tagsOf(text){return (String(text||'').match(/(^|\s)#([^\s#]+)/g)||[]).map(function(x){return x.trim().slice(1)}).slice(0,5)}
function updateStats(){document.getElementById('notesCount').textContent=fa(NOTES.length);document.getElementById('todayCount').textContent=fa(NOTES.filter(function(n){return isToday(n.createdAt)}).length)}
function renderNotes(filter){
  var grid=document.getElementById('notesGrid');
  var list=NOTES;
  if(filter)list=list.filter(function(n){return n.text.indexOf(filter)>-1});
  if(ACTIVE_FILTER==='today')list=list.filter(function(n){return isToday(n.createdAt)});
  if(ACTIVE_FILTER==='links')list=list.filter(function(n){return /https?:\/\//i.test(n.text)});
  if(ACTIVE_FILTER==='tagged')list=list.filter(function(n){return tagsOf(n.text).length});
  updateStats();
  if(!list.length){grid.innerHTML='<div class="empty">'+(filter?'چیزی پیدا نشد':'هنوز یادداشتی نیست — بالا یکی بنویس')+'</div>';return}
  grid.innerHTML=list.map(function(n,i){
    var tags=tagsOf(n.text),tone=Math.abs(String(n.id||i).split('').reduce(function(s,c){return s+c.charCodeAt(0)},0))%5;
    return '<article class="note-card tone-'+tone+'">'
      +'<div class="note-head"><span class="note-kind">✦ یادداشت</span><span class="note-time">'+relTime(n.createdAt)+'</span></div>'
      +'<div class="note-text" data-id="'+n.id+'">'+esc(n.text)+'</div>'
      +(String(n.text||'').length>220?'<button type="button" class="expand" data-expand="'+n.id+'">نمایش کامل</button>':'')
      +'<div class="note-tags">'+tags.map(function(t){return '<span class="tag">#'+esc(t)+'</span>'}).join('')+'</div>'
      +'<div class="note-actions">'
      +'<button type="button" data-edit="'+n.id+'">✎ ویرایش</button>'
      +'<button type="button" data-conv="task" data-id="'+n.id+'">✅ کار</button>'
      +'<button type="button" data-conv="reminder" data-id="'+n.id+'">🔔 یادآوری</button>'
      +'<button type="button" class="danger" data-del="'+n.id+'">🗑 حذف</button>'
      +'</div></article>';
  }).join('');
}
function loadNotes(){
  fetch('/api/inbox',{credentials:'include'}).then(function(r){
    if(r.status===401){location.href='/design/login-page.html';return null}
    return r.json();
  }).then(function(d){
    if(!d)return;
    NOTES=(d.items||[]).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
    renderNotes(document.getElementById('noteSearch').value.trim());
  }).catch(function(){document.getElementById('notesGrid').innerHTML='<div class="empty">خطای شبکه — دوباره امتحان کن</div>'});
}
function addNote(){
  var inp=document.getElementById('noteIn'),v=inp.value.trim(); if(!v)return;
  var btn=document.getElementById('noteAdd'); btn.disabled=true;
  fetch('/api/inbox',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v})})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,status:r.status,d:d}})})
    .then(function(x){
      btn.disabled=false;
      if(x.status===401){location.href='/design/login-page.html';return}
      if(!x.ok){toast((x.d&&x.d.error)||'ثبت نشد');return}
      NOTES.unshift(x.d); inp.value=''; renderNotes(''); toast('ثبت شد ✓');
    }).catch(function(){btn.disabled=false;toast('خطای شبکه')});
}
document.getElementById('noteAdd').addEventListener('click',addNote);
document.getElementById('noteIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addNote()});
document.getElementById('noteSearch').addEventListener('input',function(){renderNotes(this.value.trim())});
document.querySelector('.filters').addEventListener('click',function(e){var b=e.target.closest('button[data-filter]');if(!b)return;ACTIVE_FILTER=b.dataset.filter;document.querySelectorAll('.filter').forEach(function(x){x.classList.toggle('on',x===b)});renderNotes(document.getElementById('noteSearch').value.trim())});

document.getElementById('notesGrid').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  var q=document.getElementById('noteSearch').value.trim();
  if(b.dataset.expand){var card=b.closest('.note-card'),open=card.classList.toggle('expanded');b.textContent=open?'بستن':'نمایش کامل';return}
  if(b.dataset.del){
    var id=b.dataset.del;
    if(!confirm('این یادداشت پاک بشه؟'))return;
    fetch('/api/inbox/'+encodeURIComponent(id),{method:'DELETE',credentials:'include'})
      .then(function(r){if(r.status===401){location.href='/design/login-page.html';return null}return r.json()})
      .then(function(x){if(x==null)return;NOTES=NOTES.filter(function(n){return n.id!==id});renderNotes(q);toast('حذف شد')});
    return;
  }
  if(b.dataset.conv){
    var type=b.dataset.conv,id2=b.dataset.id;
    fetch('/api/inbox/'+encodeURIComponent(id2)+'/convert',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type})})
      .then(function(r){if(r.status===401){location.href='/design/login-page.html';return null}return r.json().then(function(d){return{ok:r.ok,d:d}})})
      .then(function(x){
        if(x==null)return;
        if(!x.ok){toast((x.d&&x.d.error)||'انجام نشد');return}
        NOTES=NOTES.filter(function(n){return n.id!==id2});renderNotes(q);
        toast(type==='task'?'به کار تبدیل شد ✓':'به یادآوری تبدیل شد ✓');
      });
    return;
  }
  if(b.dataset.edit){
    var id3=b.dataset.edit;
    var el=document.querySelector('.note-text[data-id="'+id3+'"]');
    if(!el)return;
    if(el.getAttribute('contenteditable')==='true'){
      var text=el.textContent.trim(); if(!text)return;
      el.setAttribute('contenteditable','false');
      b.textContent='✎ ویرایش';
      fetch('/api/inbox/'+encodeURIComponent(id3),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
        .then(function(r){if(r.status===401){location.href='/design/login-page.html';return null}return r.json()})
        .then(function(d){if(d==null)return;var n=NOTES.find(function(x){return x.id===id3});if(n)n.text=d.text||text;toast('ذخیره شد ✓')});
    }else{
      el.setAttribute('contenteditable','true'); el.focus();
      b.textContent='✔ ذخیره';
    }
    return;
  }
});

(function(){fetch('/api/me').then(function(r){return r.json()}).then(function(d){
  var b=document.getElementById('navAuth');if(!b)return;
  if(d&&d.user){var n=String(d.user.name||'').replace(/[<>&"]/g,'');
    b.innerHTML='<span class="navuser">'+n+'</span> <button class="navout" id="navOut">خروج</button>';
    document.getElementById('navOut').onclick=function(){fetch('/api/auth/logout',{method:'POST'}).finally(function(){location.href='/design/login-page.html'})};
  }else b.innerHTML='<a class="navin" href="/design/login-page.html">ورود</a>';
}).catch(function(){var b=document.getElementById('navAuth');if(b)b.innerHTML='<a class="navin" href="/design/login-page.html">ورود</a>'})})();

loadNotes();
</script>
</body>
</html>
